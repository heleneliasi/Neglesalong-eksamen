<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="topbar">
        <a href="/logout">Logg ut</a>
    </div>

    <div class="logo">
        <a href="/">
            <img src="{{ url_for('static', filename='images/Nailicous.svg') }}" alt="Nailicous with a cursive font and a strawberry stem on the u">
        </a>
    </div>

    <div class="subtitle">
        <h1>Hei, {{ navn }}!</h1>
    </div>

    <div class="admin-box" style="max-width: 600px; margin: 40px auto;">
        <h2>Dine bestilte timer</h2>
        {% if timer %}
        <table>
            <tr>
                <th>Tjeneste</th>
                <th>Dato</th>
                <th>Tid</th>
            </tr>
            {% for time in timer %}
            <tr>
                <td>{{ time[0] }}</td>
                <td>{{ time[1] }}</td>
                <td>{{ time[2] }}</td>
            </tr>
            {% endfor %}
        </table>
        {% else %}
        <p>Du har ingen bestilte timer.</p>
        {% endif %}
    </div>
</body>
</html>
