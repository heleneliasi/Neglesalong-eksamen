<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="topbar">
        {% if session.get("user_id") %}
            <a href="/minside">Min side</a>
        {% else %}
            <a href="/login">Logg inn</a>
        {% endif %}
    </div>

    <div class="logo">
        <a href="/">
            <img src="{{ url_for('static', filename='images/Nailicous.svg') }}" alt="Nailicous with a cursive font and a strawberry stem on the u">
        </a>
    </div>

    <div class="subtitle">
        <h1>Slett bruker</h1>
    </div>

    <div class="login">
        <form method="POST">
            Email:<br>
            <input type="email" name="email" required><br><br>

            Passord:<br>
            <input type="password" name="password" required><br><br>

            <button type="submit">Slett bruker</button>
        </form>

        <p><a href="/faq">Tilbake til FAQ</a></p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul>
                    {% for message in messages %}
                        <li>{{ message }}</li>
                    {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
    </div>
</body>
</html>
